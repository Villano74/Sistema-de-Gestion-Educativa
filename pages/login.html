<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login Completo</title>
    <link rel="stylesheet" href="../styles/estiloslogin.css">
</head>
<body>
    <div class="login-card">
        <h2>Iniciar Sesión</h2>
        <form>
            <label for="usuario">Usuario o Correo</label>
            <input type="text" id="usuario" placeholder="Ingresa tu usuario" required>
            
            <label for="password">Contraseña</label>
            <input type="password" id="password" placeholder="Ingresa tu contraseña" required>
            
            <!-- Opción para recuperar contraseña -->
            <div class="form-actions">
                <label class="remember-me">
                    <input type="checkbox" id="remember"> Recordarme
                </label>
                <a href="recuperar.html" class="forgot-pass">¿Olvidaste tu contraseña?</a>
            </div>
            
            <button type="submit">Entrar</button>
            
            <!-- Opción para registrarse -->
            <p class="register-link">¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a></p>
        </form>
    </div>
</body>
</html>
