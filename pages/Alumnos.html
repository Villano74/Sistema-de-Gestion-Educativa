<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alumnos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="styles/alumnos.css">
   
</head>

<body class="fondo">
    <header>
        <H2 class="titulo">Listado de Alumnos S.G.E.</H2>
    </header>
    <main>
        <div class="contenedor-tabla">
            <table>
                <thead>
                    <!--encabezados de la tabla-->
                    <tr>
                        <th>Matrícula</th>
                        <th>Nombre Completo</th>
                        <th>Carrera</th>
                        <th>Estado Academico</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <!--datos internos de la lista alumnos-->
                <tbody>
                    <tr>
                        <td>#1024</td>
                        <td>Ana Martínez</td>
                        <td>Profesorado Biologia</td>
                        <td><span class="estado activo">Activo</span></td>
                        <td><button class="btn-editar">Ver Perfil</button></td>
                    </tr>
                    <tr>
                        <td>#1025</td>
                        <td>Carlos Pérez</td>
                        <td>Profesorado Informatica</td>
                        <td><span class="estado activo">Activo</span></td>
                        <td><button class="btn-editar">Ver Perfil</button></td>
                    </tr>
                    <tr>
                        <td>#1026</td>
                        <td>Sofía Rodríguez</td>
                        <td>Profesorado Historia</td>
                        <td><span class="estado alerta">Riesgo</span></td>
                        <td><button class="btn-editar">Ver Perfil</button></td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="gestion-alumnos-bar">
            <!-- Buscador con Filtros -->
            <div class="buscador">
                <div class="filtro">
                    <select id="filtro-busqueda" class="input-control select-filtro">
                        <option value="nombre">Buscar por Nombre</option>
                        <option value="dni">Buscar por DNI</option>
                        <option value="correo">Buscar por Correo</option>
                    </select>
                </div>

                <div class="input-busqueda">
                    <input type="text" id="input-buscar" class="input-control text-buscar"
                        placeholder="Escribe para buscar alumno...">
                    <button type="button" class="btn-buscar">
                        Buscar
                    </button>
                </div>
            </div>

            <!-- Botón de Acción -->
            <div class="acciones-modulo">
                <button type="button" class="btn-nuevo-alumno">
                    <a href="../pages/error404.html">Nuevo Alumno</a>
                </button>
                
            </div>

        </div>

    </main>
    <hr class="hr">
    <footer>
         <div class="footer-logo-container">
            <img src="../assets/img/logo whatsapp.png" alt="whatsapp" class="logo-personalizado">Whatsapp 3834- 988244
            <img src="../assets/img/logo correo.png" alt="correo" class="logo-personalizado">info@sge.como.ar
            <img src="../assets/img/logo ubicacion.jfif" alt="ubicacion" class="logo-personalizado">Ancasti 1131
            Catamarca
        </div>
        <div class="logo-container-2">
            <a href="https://www.facebook.com/?locale=es_LA" target="_blank"><img src="../assets/img/facebook logo.png"
                    alt="facebook" class="logo-personalizado-fa"></a>
            <a href="https://www.instagram.com/" target="_blank"><img src="../assets/img/logo instagram.jfif"
                    alt="instagram" class="logo-personalizado-ins"></a>
            <a href="https://www.tiktok.com/" target="_blank"><img src="../assets/img/logo tik tok.jfif" alt="tik tok"
                    class="logo-personalizado-ti"></a>
        </div>
    </footer>
</body>

</html>
